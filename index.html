<!DOCTYPE html>
<html>
    <head>
        <title>For You</title>
        <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #f0e6f6;
                font-family: 'Chelsea Market', sans-serif;
                text-align: center;
                padding: 50px;
            }
            h1 {
                color: #ff69b4;
            }
            p {
                color: #333;
                font-size: 18px;
            }
            input {
                padding: 10px;
                font-size: 16px;
                border: 2px solid #ff69b4;
                border-radius: 5px;
                margin-top: 20px;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                color: white;
                background-color: #ff69b4;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-left: 10px;
            }
            button:hover {
                background-color: #ff1493;
            }

            #output {
                transition: opacity 0.3s ease;
            }
        </style>
    </head>
    <body>
       <h1>Hi hii :3</h1>
       <p>What is your name?</p>
       <input type="text" id="nameInput" placeholder="Enter your name">
         <button onclick="sayHi ()">Click Me</button>
         <p id="output"></p>

            <script>
                function changeText(message)
                {
                    let output = document.getElementById("output");
                    output.style.opacity = 0;
                    setTimeout(() => {
                        output.innerHTML = message;
                        output.style.opacity = 1;
                    }, 300);
                }

                function sayHi() {
                    let name = document.getElementById("nameInput").value;
                    let output = document.getElementById("output");
                    if (name === "Jaleel") {
                     changeText("Wrong name silly :P");
                    } else if (name === "jaleel") {
                     changeText("Wrong name silly :P");
                    } else if (name === "Leelee") {
                    changeText("Hi " +  name + "! " + "I made this for you <3");
                    } else if (name === "leelee") {
                    changeText("Hi " +  name + "! " + "I made this for you <3");
                    } else if (name === "Colliana") {
                    changeText("That's me!");
                    } else if (name === "lia") {
                    changeText("That's me!");
                    } else if (name === "Lia") {
                    changeText("That's me!");
                    } else if (name === "Colliana") {
                    changeText("That's me!");
                    } else {
                    changeText("I don't think I know you, but hi " + name + "!");
                    }
                }
            </script>
            <img src="chiikawa-usagi.webp" alt="Usagii" id="usagii" style="width: 200px; margin-top: 20px;">
            <script>
                document.getElementById("usagii").onclick = function() {
                    let response = prompt("Do you think it's cute? (yes/no)") ;
                    if (response.toLowerCase() === "yes") {
                        alert("I agree, it's super cute! :3");
                    } else if (response.toLowerCase() === "no") {
                        alert("Oh no, I think it's adorable! :(");
                    } else {
                        alert("It's a yes or no question, let's try again!");
                    }
                };
            </script>
    </body>             
</html>
